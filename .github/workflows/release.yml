name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" \
            --jq '.verification.verified == true and .verification.reason == "valid"')"
          test "$VERIFIED" = "true"
      - name: Verify tag and source versions
        run: IMESSAGE_TEST_PYTHON="$(command -v python3)" ./tools/test.sh "$GITHUB_REF_NAME"
      - name: Run release checks
        run: |
          brew install shellcheck
          bash -n skills/imessage-review/bootstrap.sh skills/imessage-review/install.sh skills/imessage-review/install-hardened.sh skills/imessage-review/uninstall.sh skills/imessage-review/uninstall-hardened.sh skills/imessage-review/tools/select_python.sh tools/test.sh
          shellcheck skills/imessage-review/bootstrap.sh skills/imessage-review/install.sh skills/imessage-review/install-hardened.sh skills/imessage-review/uninstall.sh skills/imessage-review/uninstall-hardened.sh skills/imessage-review/tools/select_python.sh tools/test.sh
          plutil -lint skills/imessage-review/com.jeffhuber.claudecowork-imessage.plist.template
          clang -Wall -Wextra -Werror -O2 \
            -DHELPER_SCRIPT='"/tmp/helper.py"' \
            -DSEND_GATE_SCRIPT='"/tmp/send_gate.py"' \
            -DCONFIRM_HELPER='"/tmp/claude-cowork-imessage-confirm"' \
            -DBRIDGE_ROOT='"/tmp/claude-imessage-bridge"' \
            -DPYTHON_INTERPRETER='"/usr/bin/python3"' \
            -DHELPER_DISPLAY_NAME='"claude-cowork-imessage-helper"' \
            -DHOST_DISPLAY_NAME='"Claude Cowork"' \
            -fsyntax-only skills/imessage-review/bin/imessage_helper.c
          clang -Wall -Wextra -Werror -fobjc-arc \
            -framework AppKit -framework Foundation \
            -o /tmp/claude-cowork-imessage-confirm \
            skills/imessage-review/bin/confirm_imessage_send.m
      - name: Build checksummed release artifacts
        run: |
          mkdir -p dist
          PREFIX="claudecowork-imessage-skill-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$PREFIX/" -o "dist/$PREFIX.tar.gz" "$GITHUB_SHA"
          git archive --format=zip --prefix="$PREFIX/" -o "dist/$PREFIX.zip" "$GITHUB_SHA"
          git archive --format=zip -o dist/imessage-review.plugin "$GITHUB_SHA"
          (cd dist && shasum -a 256 "$PREFIX.tar.gz" "$PREFIX.zip" imessage-review.plugin > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
