name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: IMESSAGE_TEST_PYTHON="$(command -v python)" ./tools/test.sh v1.2.2
      - run: bash -n skills/imessage-review/bootstrap.sh skills/imessage-review/install.sh skills/imessage-review/install-hardened.sh skills/imessage-review/uninstall.sh skills/imessage-review/uninstall-hardened.sh skills/imessage-review/tools/select_python.sh tools/test.sh
      - run: shellcheck skills/imessage-review/bootstrap.sh skills/imessage-review/install.sh skills/imessage-review/install-hardened.sh skills/imessage-review/uninstall.sh skills/imessage-review/uninstall-hardened.sh skills/imessage-review/tools/select_python.sh tools/test.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: IMESSAGE_TEST_PYTHON="$(command -v python3)" ./tools/test.sh v1.2.2
      - run: plutil -lint skills/imessage-review/com.jeffhuber.claudecowork-imessage.plist.template
      - name: Compile FDA wrapper
        run: >-
          clang -Wall -Wextra -Werror -O2
          -DHELPER_SCRIPT='"/tmp/helper.py"'
          -DSEND_GATE_SCRIPT='"/tmp/send_gate.py"'
          -DCONFIRM_HELPER='"/tmp/claude-cowork-imessage-confirm"'
          -DBRIDGE_ROOT='"/tmp/claude-imessage-bridge"'
          -DPYTHON_INTERPRETER='"/usr/bin/python3"'
          -DHELPER_DISPLAY_NAME='"claude-cowork-imessage-helper"'
          -DHOST_DISPLAY_NAME='"Claude Cowork"'
          -fsyntax-only skills/imessage-review/bin/imessage_helper.c
      - name: Compile native confirmation helper
        run: >-
          clang -Wall -Wextra -Werror -fobjc-arc
          -framework AppKit -framework Foundation
          -o /tmp/claude-cowork-imessage-confirm
          skills/imessage-review/bin/confirm_imessage_send.m
