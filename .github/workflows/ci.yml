name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: >-
          python -m py_compile
          skills/imessage-review/bin/helper.py
          skills/imessage-review/bin/send_gate.py
          skills/imessage-review/tools/doctor.py
          skills/imessage-review/tools/configure_allowlist.py
          skills/imessage-review/tools/migrate_legacy_launchagent.py
          tools/check_shared_core.py
          tools/check_version.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_shared_core.py
      - run: python -m json.tool .claude-plugin/plugin.json >/dev/null
      - run: python tools/check_version.py v1.2.1
      - run: bash -n skills/imessage-review/bootstrap.sh skills/imessage-review/install.sh skills/imessage-review/install-hardened.sh skills/imessage-review/uninstall.sh skills/imessage-review/uninstall-hardened.sh skills/imessage-review/tools/select_python.sh
      - run: shellcheck skills/imessage-review/bootstrap.sh skills/imessage-review/install.sh skills/imessage-review/install-hardened.sh skills/imessage-review/uninstall.sh skills/imessage-review/uninstall-hardened.sh skills/imessage-review/tools/select_python.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: plutil -lint skills/imessage-review/com.jeffhuber.claudecowork-imessage.plist.template
      - name: Compile FDA wrapper
        run: >-
          clang -Wall -Wextra -Werror -O2
          -DHELPER_SCRIPT='"/tmp/helper.py"'
          -DSEND_GATE_SCRIPT='"/tmp/send_gate.py"'
          -DCONFIRM_HELPER='"/tmp/claude-cowork-imessage-confirm"'
          -DBRIDGE_ROOT='"/tmp/claude-imessage-bridge"'
          -DPYTHON_INTERPRETER='"/usr/bin/python3"'
          -DHELPER_DISPLAY_NAME='"claude-cowork-imessage-helper"'
          -DHOST_DISPLAY_NAME='"Claude Cowork"'
          -fsyntax-only skills/imessage-review/bin/imessage_helper.c
      - name: Compile native confirmation helper
        run: >-
          clang -Wall -Wextra -Werror -fobjc-arc
          -framework AppKit -framework Foundation
          -o /tmp/claude-cowork-imessage-confirm
          skills/imessage-review/bin/confirm_imessage_send.m
